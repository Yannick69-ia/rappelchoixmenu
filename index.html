:root{
  --bg:#EFE5D7; --card:#FFFDF9; --ink:#1B2A4A; --muted:#7A6E65; --faint:#A2988C;
  --line:#E3D7C5; --accent:#E85946; --accent-light:#F0796A; --accent-soft:#F7DDD6;
  --serif:'JazminAlt',Georgia,serif; --sans:'CabinetGrotesk',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(27,42,74,.05),0 10px 26px rgba(27,42,74,.07);
  --viande:#B24A34; --poisson:#2F5D7C; --vege:#6F8A4E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;padding:0 20px;padding-block:40px 64px;}

.mast{text-align:center;margin-bottom:26px}
.emblem{width:62px;height:62px;color:var(--accent);margin:0 auto 12px;display:block}
.emblem svg{width:100%;height:100%;display:block}
.names{font-family:var(--serif);font-weight:900;font-size:38px;line-height:1.02;letter-spacing:.01em;color:var(--ink)}
.names em{font-style:italic;color:var(--accent);font-weight:900;padding:0 .06em}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 0;max-width:200px}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line))}
.rule::after{background:linear-gradient(90deg,var(--line),transparent)}
.rule span{width:7px;height:7px;transform:rotate(45deg);background:var(--accent);opacity:.9}
.subtitle{margin-top:12px;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}

.lead{text-align:center;color:var(--muted);font-size:15.5px;max-width:40ch;margin:0 auto 26px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field select,.field input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path fill='%237A6E65' d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.field select:disabled{opacity:.55;cursor:not-allowed}
.field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;width:100%;
  font:inherit;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  padding:14px 18px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);
  color:var(--card);box-shadow:var(--shadow);transition:background .2s,transform .2s}
.btn:hover{background:var(--accent-light);border-color:var(--accent-light);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line);text-transform:none;letter-spacing:.02em;font-size:13px}
.btn.ghost:hover{background:var(--accent);color:var(--card)}
.btn.small{width:auto;padding:10px 16px}

.msg{margin-top:16px;text-align:center;font-size:14px;color:var(--accent);font-weight:600;min-height:1.2em}
.picker{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.picker p{margin:0 0 2px;text-align:center;font-size:13px;color:var(--muted)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 15px;font:inherit;text-align:left;color:var(--ink)}
.pick:hover{border-color:var(--accent)}
.pick .pn{font-family:var(--serif);font-weight:900;font-size:18px}
.pick .pn .sur{font-size:.82em;color:var(--muted)}
.pick .arrow{color:var(--accent);font-weight:700}

.res{text-align:center}
.res .hello{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.res .who{font-family:var(--serif);font-size:32px;font-weight:900;line-height:1.06;margin-bottom:6px}
.res .who .sur{font-size:.76em;color:var(--muted)}
.res .where{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.welcome{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:34ch;margin:0 auto 22px}
.plate .desc{font-size:13px;color:var(--muted);line-height:1.5;max-width:40ch;margin-top:6px}
.plate.dessert .v{color:var(--accent)}
.footlogo{display:flex;justify-content:center;margin-top:26px;color:var(--accent)}
.footlogo svg{width:46px;height:46px;display:block}

.plate{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 18px;border-radius:14px;
  background:var(--bg);border:1px solid var(--line);margin-bottom:14px}
.plate .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
.plate .v{font-family:var(--serif);font-size:30px;font-weight:900;display:flex;align-items:center;gap:12px;color:var(--accent)}
.plate .v .dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.allerg{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;background:var(--accent-soft);
  border-radius:11px;padding:12px 15px;color:var(--accent);font-weight:600;font-size:14px;margin-bottom:8px}
.allerg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.res .again{margin-top:22px}

.tip{margin-top:22px;text-align:center;font-size:12.5px;color:var(--faint)}
.tip a{color:var(--accent);font-weight:700;text-decoration:none}
.foot{text-align:center;margin-top:40px;color:var(--faint);font-size:12px}

.printcard{display:none}
@media print{
  @page{margin:16mm}
  body{background:#fff}
  .no-print{display:none!important}
  .wrap>*{display:none}
  .wrap .printcard{display:flex}
  .printcard{flex-direction:column;align-items:center;text-align:center;gap:14px;color:var(--ink);
    border:1.5px solid var(--accent);border-radius:18px;padding:34px 28px;max-width:340px;margin:0 auto}
  .printcard .pc-emblem{width:56px;height:56px;color:var(--accent)}
  .printcard .pc-emblem svg{width:100%;height:100%}
  .printcard .pc-names{font-family:var(--serif);font-weight:900;font-size:28px}
  .printcard .pc-names em{font-style:italic;color:var(--accent)}
  .printcard .pc-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .printcard .pc-title{font-family:var(--serif);font-weight:900;font-size:20px;margin-top:2px}
  .printcard .pc-qr{width:190px;height:190px;background:#fff;padding:8px}
  .printcard .pc-qr img,.printcard .pc-qr canvas{width:100%!important;height:100%!important;display:block}
  .printcard .pc-steps{font-size:13px;color:var(--ink);line-height:1.6}
}
@media (max-width:420px){ .names{font-size:32px} }
.wordmark{width:min(300px,80%);margin:0 auto 2px;display:block}
.wordmark svg{width:100%;height:auto;display:block}
.pc-wordmark{width:230px;margin:0 auto}
.pc-wordmark svg{width:100%;height:auto;display:block}
.confetti-piece{position:fixed;top:0;border-radius:2px;pointer-events:none;z-index:9999;opacity:0}
</style>
</head>

<script>
var BAKED_BASE = "https://claude.ai/artifact/WgQaQBCEn2CCg95FLvVi5E";
var TABLES = {1:"Table d'Honneur",2:"Amis Yannick & Erin",3:"Amis Erin & Yannick",4:"Famille Yannick",
5:"Amis Erin",6:"Amis Erin",7:"Amis Yannick",8:"Famille & Amis Erin",9:"Famille & Amis Erin",
10:"Famille Yannick",11:"Famille Yannick",12:"Jeune Famille & Ami Erin",13:"Famille Yannick",
14:"Famille Yannick",15:"Famille Yannick",16:"Famille Yannick"};
var DATA = JSON.parse(document.getElementById('data').textContent);
var MEALC = {"Viande":"var(--viande)","Poisson":"var(--poisson)","Végétarien":"var(--vege)"};
var DISHES={"Viande":"Black Angus confit, jus de cuisson corsé, coulis de cresson, blinis de pomme de terre à la sarriette, mousseline de butternut","Poisson":"Dos de cabillaud sauce vierge arlequin, risotto de petit épeautre aux légumes de saison","Végétarien":"Risotto de petit épeautre aux légumes de printemps"};
var CHEESE={"Blanc":"Faisselle d’Ardèche et coulis de fruits rouges","Sec":"Comté du Jura 18 mois, et petit mesclun à l’huile d’olive de Nyons"};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[-''.]/g,' ').replace(/\s+/g,' ').trim();}
function niceName(raw){
  var paren=raw.indexOf('(');
  var main=paren>=0?raw.slice(0,paren).trim():raw.trim();
  var rest=paren>=0?' '+raw.slice(paren).trim():'';
  var toks=main.split(/\s+/),i=0,sur=[];
  while(i<toks.length && toks[i] && toks[i]===toks[i].toUpperCase() && /[A-ZÀ-ÖØ-Þ]/.test(toks[i].normalize('NFC'))){ sur.push(toks[i]); i++; }
  var given=toks.slice(i).join(' ');
  if(sur.length && given) return {given:given,sur:sur.join(' '),rest:rest};
  return {given:raw,sur:'',rest:''};
}
function nameHtml(n){ return n.sur? esc(n.given)+' <span class="sur">'+esc(n.sur)+'</span>'+esc(n.rest) : esc(n.given); }
function detectedBase(){ var l=location.origin+location.pathname; return (location.origin==='null'||!/^https?:/.test(l))?'':l; }
function baseUrl(){ return (BAKED_BASE||detectedBase()).replace(/[?#].*$/,''); }

function matches(tableId,q){
  var list=DATA[tableId]||[], nq=norm(q);
  if(!nq) return [];
  return list.filter(function(g){
    var n=niceName(g.nom), given=norm(n.given), sur=norm(n.sur);
    var gfirst=given.split(' ')[0];
    return given===nq || gfirst===nq || given.indexOf(nq)===0 || gfirst.indexOf(nq)===0
        || sur.split(' ').indexOf(nq)>=0 || norm(g.nom).indexOf(nq)===0;
  });
}
function fmtMeal(m){ return '<span class="dot" style="background:'+(MEALC[m]||'var(--muted)')+'"></span>'+esc(m); }
function fromageLabel(f){ return f==='Pas de fromage' ? 'Sans fromage' : f; }

function fullName(nom){ var n=niceName(nom); return (n.given+(n.sur?' '+n.sur:'')+n.rest).trim(); }

function showForm(preTable){
  var app=document.getElementById('app');
  document.getElementById('mastSub').textContent='3 octobre 2026';
  var opts='<option value="">Choisir\u2026</option>';
  Object.keys(DATA).sort(function(a,b){return a-b;}).forEach(function(id){
    opts+='<option value="'+id+'"'+(String(preTable)===String(id)?' selected':'')+'>'+id+'</option>';
  });
  app.innerHTML=
     '<p class="lead">Choisissez votre table puis votre nom pour retrouver le repas que vous aviez choisi.</p>'
    +'<div class="card"><form class="form" id="lookup" novalidate>'
    +'  <div class="field"><label for="fTable">Num\u00e9ro de table</label>'
    +'    <select id="fTable" required>'+opts+'</select></div>'
    +'  <div class="field"><label for="fName">Je suis</label>'
    +'    <select id="fName" required disabled><option value="">Choisissez d\u2019abord votre table</option></select></div>'
    +'  <button class="btn" type="submit">Afficher mon repas</button>'
    +'  <div class="msg" id="msg"></div>'
    +'</form></div>';
  document.getElementById('foot').textContent='Erin & Yannick \u00b7 3 octobre 2026';
  var tableSel=document.getElementById('fTable'), nameSel=document.getElementById('fName');
  function fillNames(){
    var t=tableSel.value;
    if(!t || !DATA[t]){ nameSel.disabled=true; nameSel.innerHTML='<option value="">Choisissez d\u2019abord votre table</option>'; return; }
    var arr=DATA[t].map(function(g,idx){return {idx:idx,disp:fullName(g.nom)};});
    arr.sort(function(a,b){return a.disp.localeCompare(b.disp,'fr',{sensitivity:'base'});});
    nameSel.disabled=false;
    nameSel.innerHTML='<option value="">Choisir\u2026</option>'+arr.map(function(o){return '<option value="'+o.idx+'">'+esc(o.disp)+'</option>';}).join('');
  }
  tableSel.addEventListener('change', fillNames);
  if(preTable && DATA[preTable]){ fillNames(); }
  document.getElementById('lookup').addEventListener('submit',function(e){
    e.preventDefault();
    var t=tableSel.value, idx=nameSel.value, msg=document.getElementById('msg');
    if(!t){ msg.textContent='Choisissez d\u2019abord votre table.'; return; }
    if(idx===''){ msg.textContent='Choisissez votre nom dans la liste.'; return; }
    showResult(t, DATA[t][+idx]);
  });
}
function showResult(tableId,g){
  var app=document.getElementById("app");
  var n=niceName(g.nom);
  document.getElementById("mastSub").textContent="3 octobre 2026";
  var fullName=esc(n.given)+(n.sur?" "+esc(n.sur):"")+esc(n.rest);
  var dish=DISHES[g.repas]||"";
  var cheeseDesc=CHEESE[g.fromage]||"";
  var allerg=g.allergie? '<div class="allerg">À éviter / allergie&nbsp;: '+esc(g.allergie)+'</div>':"";
  app.innerHTML=
     '<div class="card res">'
    +'  <div class="who">'+fullName+'</div>'
    +'  <div class="where">Table '+tableId+'</div>'
    +'  <p class="welcome">Voici un rappel de tes choix 😉 Nous te souhaitons un bon appétit&nbsp;!</p>'
    +'  <div class="plate"><div class="k">Votre plat</div><div class="v">'+esc(g.repas)+'</div>'+(dish?'<div class="desc">'+esc(dish)+'</div>':"")+'</div>'
    +'  <div class="plate"><div class="k">Votre fromage</div><div class="v">'+esc(fromageLabel(g.fromage))+'</div>'+(cheeseDesc?'<div class="desc">'+esc(cheeseDesc)+'</div>':"")+'</div>'
    +'  <div class="plate"><div class="k">Le dessert</div><div class="v">Pavlova géante aux fruits rouges</div></div>'
    + allerg
    +'  <div class="again"><button class="btn ghost small" type="button" onclick="showForm()">← Nouvelle recherche</button></div>'
    +'</div>';
  document.getElementById("foot").textContent="Erin & Yannick · 3 octobre 2026";
  try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){}
  try{ launchConfetti(); }catch(e){}
}
function printCard(){
  var el=document.getElementById('pcQr'); el.innerHTML='';
  try{ new QRCode(el,{text:baseUrl(),width:180,height:180,colorDark:'#1B2A4A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  setTimeout(function(){ window.print(); }, 250);
}
function launchConfetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.confetti-piece').forEach(function(e){e.remove();});
  var colors=['#E85946','#F2A3A3','#F7C5B8','#E85946','#F4847A'];
  var count=200, pieces=[];
  for(var i=0;i<count;i++){
    var el=document.createElement('div');
    el.className='confetti-piece';
    var w=4+Math.random()*5;
    el.style.width=w+'px'; el.style.height=w+'px';
    el.style.left=Math.random()*100+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius=Math.random()>0.5?'50%':'2px';
    document.body.appendChild(el);
    pieces.push({el:el,x:parseFloat(el.style.left),y:-20,vy:3+Math.random()*4,vx:(Math.random()-0.5)*2,rot:Math.random()*360,vrot:(Math.random()-0.5)*8,duration:2500+Math.random()*2000,delay:Math.random()*1500,start:null});
  }
  function animatePieces(ts){
    var alive=false;
    for(var k=0;k<pieces.length;k++){
      var p=pieces[k];
      if(!p.el.parentNode) continue;
      if(!p.start) p.start=ts;
      var elapsed=ts-p.start-p.delay;
      if(elapsed<0){ alive=true; continue; }
      var progress=elapsed/p.duration;
      if(progress>=1){ p.el.remove(); continue; }
      alive=true;
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.vrot;
      var opacity=progress<0.1?progress/0.1:(progress>0.8?1-(progress-0.8)/0.2:1);
      p.el.style.opacity=opacity;
      p.el.style.transform='translate('+p.vx+'px, '+p.y+'px) rotate('+p.rot+'deg)';
    }
    if(alive) requestAnimationFrame(animatePieces);
  }
  requestAnimationFrame(animatePieces);
}
(function(){
  var t=null,pre=null;
  try{ var u=new URL(location.href); t=u.searchParams.get('table'); pre=u.searchParams.get('prenom'); }catch(e){}
  if(!t){ var m=(location.hash||'').match(/table=?(\d+)/)||(location.search||'').match(/table=(\d+)/); if(m) t=m[1]; }
  showForm(t&&DATA[t]?t:'');
})();
</script>
